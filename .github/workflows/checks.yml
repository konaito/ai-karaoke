name: Check karaoke scoring
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/scoring.test.mjs
      - run: node --check app.js && node --check scoring-ui.js && node --check sw.js
      - run: git diff --check
